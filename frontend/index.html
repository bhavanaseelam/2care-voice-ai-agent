<!DOCTYPE html>
<html>

<head>

    <title>
        2Care Voice AI Agent
    </title>

    <style>

        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {

            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {

            text-align: center;
            color: #2563eb;
        }

        textarea {

            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            margin-top: 20px;
        }

        button {

            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
        }

        .response {

            margin-top: 30px;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 10px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
            2Care Voice AI Agent
        </h1>

        <textarea
            id="message"
            placeholder="Type your healthcare request here..."
        ></textarea>

        <button onclick="sendMessage()">
            Send Request
        </button>

        <div
            class="response"
            id="response"
        >

            AI response will appear here...

        </div>

    </div>

    <script>

        async function sendMessage() {

            const message =
                document.getElementById("message").value;

            const response =
                await fetch(
                    "http://127.0.0.1:8000/voice-agent",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                            "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })
                    }
                );

            const data = await response.json();

            document.getElementById(
                "response"
            ).innerHTML = `

                <h3>Final Response</h3>

                <p>${data.final_response}</p>

                <h3>Latency</h3>

                <p>${data.latency_seconds} seconds</p>

            `;
        }

    </script>

</body>

</html>
